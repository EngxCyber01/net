<style>
/* Layout: fixed left contents rail on wide screens, slide-in drawer on phones; single reading column; quiz as a separate view. */
:root {
  --bg: #f4f6f5;
  --paper: #ffffff;
  --ink: #152320;

  --bad: #b3261e;

    --line: #26332f; --line-strong: #3c4d47; --accent: #5fd0b8; --accent-ink: #0a1210; --accent-soft: #19302b;
    --mark: rgba(233, 178, 40, 0.30); --note-bg: #231f12; --note-line: #5a4f25;
    --good: #6fd39a; --good-bg: #143024; --bad: #ff8f86; --bad-bg: #3a1a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --paper: #151d1b; --ink: #e5ede9; --ink-2: #b2c0bb; --ink-3: #8a9a95;
  --line: #26332f; --line-strong: #3c4d47; --accent: #5fd0b8; --accent-ink: #0a1210; --accent-soft: #19302b;
  --mark: rgba(233, 178, 40, 0.30); --note-bg: #231f12; --note-line: #5a4f25;

}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;

}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.top-row { display: flex; align-items: center; gap: 8px; min-height: 52px; max-width: 1180px; margin: 0 auto; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; margin-right: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.btn {
  min-height: 44px; min-width: 44px; padding: 0 14px; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 4px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; }
.btn[aria-pressed="true"], .btn.on { background: var(--accent-soft); border-color: var(--accent); }
.progress { height: 3px; background: var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); }

/* Shell */
.shell { max-width: 1180px; margin: 0 auto; display: block; }
.rail {
  position: fixed; z-index: 70; top: 0; bottom: 0; left: 0; width: min(88vw, 340px); background: var(--paper); border-right: 1px solid var(--line);
  transform: translateX(-102%); transition: transform 0.18s ease; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.rail.open { transform: none; box-shadow: 0 0 0 100vmax rgba(10, 20, 18, 0.45); }
.rail h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 6px; font-weight: 600; }
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rail-head strong { font-size: 15px; }
.lec-btn {
  width: 100%; text-align: left; border: 0; background: none; padding: 10px 8px; min-height: 44px; border-radius: 4px; display: flex; gap: 10px; align-items: baseline;
}
.lec-btn:hover { background: var(--accent-soft); }
.lec-btn .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); flex: none; }
.lec-btn[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.toc { list-style: none; margin: 2px 0 10px 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); }
.toc a { display: block; padding: 8px 10px; min-height: 40px; font-size: 14px; color: var(--ink-2); text-decoration: none; border-radius: 4px; }
.toc a:hover { background: var(--accent-soft); color: var(--ink); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.rail .btn { width: 100%; justify-content: flex-start; margin-top: 8px; }

@media (min-width: 960px) {
  .shell { max-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; }
  .rail { position: sticky; top: 56px; transform: none; width: auto; height: calc(100vh - 56px); border: 0; border-right: 1px solid var(--line); background: transparent; padding: 18px 16px 24px 16px; z-index: 1; box-shadow: none !important; }
  main { width: 100%; max-width: 900px; margin: 0 auto; padding-inline: 40px; }

}

/* Reading area */

.lec-head { padding-bottom: 20px; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 0 0 10px; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
.blurb { font-family: var(--font-read); font-size: 18px; color: var(--ink-2); margin: 0; max-width: 62ch; }
.source-note { font-size: 13px; color: var(--ink-3); margin: 14px 0 0; max-width: 62ch; }
.lec-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

details.topic { border-bottom: 1px solid var(--line); }
details.topic > summary {
  list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; padding: 18px 0; min-height: 56px;
}
details.topic > summary::-webkit-details-marker { display: none; }
details.topic > summary::before {
  content: "+"; flex: none; width: 26px; height: 26px; margin-top: 1px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 4px; font-family: var(--font-mono); font-size: 16px; line-height: 1; color: var(--accent);
}
details.topic[open] > summary::before { content: "\2212"; }
.topic-title { font-size: 21px; line-height: 1.25; font-weight: 600; margin: 0; text-wrap: balance; }
.topic-src { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 400; margin-top: 3px; }

.topic-body p { margin: 0; }
strong { font-weight: 650; background: linear-gradient(transparent 58%, var(--mark) 58%); }

.label { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; }

.defs { border: 1px solid var(--line-strong); background: var(--paper); }
.defs .label { padding: 8px 14px; margin: 0; background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid var(--line-strong); }
.defs dl { margin: 0; }

.list ul, .list ol { margin: 0; padding-left: 22px; }

.steps li { counter-increment: s; position: relative; padding: 0 0 12px 40px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 13px; font-weight: 600; border-radius: 50%; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 12.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line-strong); }

.pc { display: grid; grid-template-columns: 1fr; gap: 12px; }

.pc > div { border: 1px solid var(--line); background: var(--paper); padding: 12px 14px; min-width: 0; }

.pc .con .label { color: var(--bad); }
.pc ul { margin: 0; padding-left: 20px; }
.pc li + li { margin-top: 5px; }

.tbl { overflow-x: auto; border: 1px solid var(--line-strong); background: var(--paper); -webkit-overflow-scrolling: touch; }

.tbl th { font-family: var(--font-ui) !important; font-size: 12.5px !important; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); background: var(--accent-soft); font-weight: 600; }
.tbl tbody th { text-transform: none; letter-spacing: 0; font-size: 14px !important; color: var(--ink); background: transparent; }
.tbl td { font-size: 16px !important; line-height: 1.5 !important; }

.fig { margin: 0; border: 1px solid var(--line-strong); background: var(--paper); padding: 14px; }

.dg text { fill: var(--ink); font-family: var(--font-ui); font-size: 12px; text-anchor: middle; }
.dg text.sm { font-size: 11.5px; }

.dg text.halo { paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }

.note { border: 1px dashed var(--note-line); background: var(--note-bg); padding: 12px 14px; }

.take { border-top: 2px solid var(--accent); background: var(--accent-soft); padding: 14px 16px; }
.take .label { color: var(--accent); }
.take li { font-size: 17px !important; }

/* Search */
.search-box { display: none; padding: 0 0 12px; max-width: 1180px; margin: 0 auto; }
.search-box.open { display: block; }
.search-box input { width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 4px; }
.results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 52vh; overflow-y: auto; border: 1px solid var(--line); background: var(--paper); }
.results:empty { display: none; }
.results button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; min-height: 48px; }
.results li:first-child button { border-top: 0; }

.results .r-t { font-weight: 600; font-size: 15px; }

.empty-msg { padding: 12px 14px; color: var(--ink-2); font-size: 14px; border: 1px solid var(--line); background: var(--paper); margin-top: 8px; }

/* Quiz */
.quiz { max-width: 720px; }

.q-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-3); margin-bottom: 8px; }
.q-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); margin-bottom: 18px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }

.q-text { font-family: var(--font-read); font-size: 21px; line-height: 1.4; margin: 0 0 16px; font-weight: 500; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; min-height: 52px; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 4px; font-size: 16.5px; line-height: 1.4;
}
.opt .k { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font-family: var(--font-mono); font-size: 12.5px; margin-top: 0; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }

.opt.right { border-color: var(--good); background: var(--good-bg); }

.opt.right .tag { color: var(--good); }
.opt.wrong .tag { color: var(--bad); }
.feedback { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line-strong); background: var(--paper); }
.feedback.ok { border-color: var(--good); background: var(--good-bg); }
.feedback.no { border-color: var(--bad); background: var(--bad-bg); }
.feedback h3 { margin: 0 0 4px; font-size: 16px; }

.q-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.score { border: 1px solid var(--line-strong); background: var(--paper); padding: 20px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.stats div { border: 1px solid var(--line); padding: 10px 12px; }
.stats b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12.5px; color: var(--ink-3); }
.review { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.review li { border: 1px solid var(--line); background: var(--paper); padding: 12px 14px; }
.review li.ok { border-left: 4px solid var(--good); }
.review li.no { border-left: 4px solid var(--bad); }
.review .rq { font-family: var(--font-read); font-size: 17px; margin: 2px 0 8px; }
.review .ra { font-size: 14.5px; color: var(--ink-2); margin: 2px 0; }
.review .ra b { color: var(--ink); }
.review .rw { font-family: var(--font-read); font-size: 15.5px; color: var(--ink-2); margin-top: 8px; }
.review .rt { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }

.to-top { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18); }

.state { padding: 40px 0; color: var(--ink-2); }

.btn .short { display: inline; } .btn .long { display: none; }

</style>
<header class="top">
  <div class="top-row">
    <button class="btn" id="menuBtn" aria-controls="rail" aria-expanded="false">Menu</button>
    <div class="brand">Network Principles<small>Study and revision</small></div>

    <input id="searchInput" type="search" placeholder="Search topics, terms and protocols" autocomplete="off">

  </div>

</header>

</div>

<script>
/* Content helpers: lecture data is plain data built with these constructors. */
const LECTURES = [];
const P = (x) => ({ t: "p", x });
const DEF = (...items) => ({ t: "def", items });
const LIST = (title, items) => ({ t: "list", title, items });
const STEPS = (title, items) => ({ t: "steps", title, items });
const TABLE = (caption, head, rows) => ({ t: "table", caption, head, rows });
const PROS = (pros, cons) => ({ t: "pros", pros, cons });
const NOTE = (x) => ({ t: "note", x });
const DIAG = (id, caption) => ({ t: "diagram", id, caption });
const EX = (x) => ({ t: "example", x });
const TAKE = (...items) => ({ t: "take", items });
const T = (id, title, source, ...blocks) => ({ id, title, source, blocks });

/* SVG diagrams. Each one only draws what the lecture text states. Colors come from CSS classes (see style.css). */
const dgWrap = (id, h, label, inner) =>
  `<svg class="dg" viewBox="0 0 360 ${h}" role="img" aria-label="${label}"><defs><marker id="ah-${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ahp"/></marker></defs>${inner}</svg>`;
const dgRect = (x, y, w, h, c) => `<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
const dgText = (x, y, s, c = "") => `<text class="${c}" x="${x}" y="${y}">${s}</text>`;
const dgBox = (x, y, w, h, lines, c = "n", tc = "") =>
  dgRect(x, y, w, h, c) + lines.map((s, i) => dgText(x + w / 2, y + h / 2 + (i - (lines.length - 1) / 2) * 13 + 4, s, tc)).join("");
const dgLine = (x1, y1, x2, y2, c = "l", m = "") =>
  `<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${m ? ` marker-end="url(#ah-${m})"` : ""}/>`;
const dgCircle = (cx, cy, r, label, c = "n") => `<circle class="${c}" cx="${cx}" cy="${cy}" r="${r}"/>` + dgText(cx, cy + 4, label, "sm");
const polar = (cx, cy, r, k, n) => {
  const a = (-90 + (360 / n) * k) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
};

/* App: reads LECTURES, QUESTIONS and DIAGRAMS and renders the reading view, search and quiz. No content lives in this file. */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  const plain = (s) => String(s).replace(/\*\*/g, "").replace(/`/g, "");
  const letters = "ABCDEFGH";

  const view = $("#view"), rail = $("#rail"), scrim = $("#scrim");
  const lecById = (id) => LECTURES.find((l) => l.id === id);
  let pendingTopic = null;
  let quiz = { lec: "all", pool: [], i: 0, ans: [], finished: false, focus: false };

  /* ---------- Block renderers ---------- */
  const R = {
    p: (b) => `<p>${fmt(b.x)}</p>`,
    def: (b) => `<div class="defs"><p class="label">Definitions</p><dl>${b.items.map(([t, d]) => `<div class="d"><dt>${esc(t)}</dt><dd>${fmt(d)}</dd></div>`).join("")}</dl></div>`,
    list: (b) => `<div class="list"><p class="label">${esc(b.title)}</p><ul>${b.items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul></div>`,
    steps: (b) => `<div class="steps"><p class="label">${esc(b.title)}</p><ol>${b.items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ol></div>`,
    table: (b) => `<div class="tbl${b.head.length <= 2 ? " narrow" : ""}" tabindex="0" role="region" aria-label="${esc(b.caption)}"><table><caption>${esc(b.caption)}</caption><thead><tr>${b.head.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c, i) => (i === 0 ? `<th scope="row">${fmt(c)}</th>` : `<td>${fmt(c)}</td>`)).join("")}</tr>`).join("")}</tbody></table></div>`,
    pros: (b) => `<div class="pc"><div class="pro"><p class="label">Advantages</p><ul>${b.pros.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul></div><div class="con"><p class="label">Disadvantages</p><ul>${b.cons.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul></div></div>`,
    note: (b) => `<div class="note"><p class="label">Not detailed in the slides</p><p>${fmt(b.x)}</p></div>`,
    example: (b) => `<div class="example"><p class="label">Example from the lecture</p><p>${fmt(b.x)}</p></div>`,
    diagram: (b) => `<figure class="fig">${DIAGRAMS[b.id]()}<figcaption>${fmt(b.caption)}</figcaption></figure>`,
    take: (b) => `<div class="take"><p class="label">Key takeaways</p><div class="list"><ul>${b.items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul></div></div>`
  };

  function topicHtml(lec, t, n) {
    return `<details class="topic" id="t-${lec.id}-${t.id}" open><summary><span><h3 class="topic-title">${esc(t.title)}</h3><span class="topic-src">${esc(t.source)}</span></span></summary><div class="topic-body">${t.blocks.map((b) => R[b.t](b)).join("")}</div></details>`;
  }

  /* ---------- Rail (lecture list, contents, quiz link) ---------- */
  function renderRail(current) {
    let h = `<div class="rail-head"><strong>Network Principles</strong><button class="btn ghost" id="closeRail" aria-label="Close menu">Close</button></div><h2>Lectures</h2><nav aria-label="Lectures">`;
    LECTURES.forEach((l) => {
      h += `<button class="lec-btn" data-lec="${l.id}"${current === l.id ? ' aria-current="true"' : ""}><span class="n">L${l.id}</span><span>${esc(l.title)}</span></button>`;
      if (current === l.id) h += `<ul class="toc">${l.topics.map((t) => `<li><a href="#lecture-${l.id}" data-topic="${t.id}" data-lec="${l.id}">${esc(t.title)}</a></li>`).join("")}</ul>`;
    });
    h += `</nav><h2>Practice</h2><button class="btn${current === "quiz" ? " on" : ""}" data-go="quiz"${current === "quiz" ? ' aria-current="true"' : ""}>Test Yourself</button>`;
    rail.innerHTML = h;
  }
  function openRail(o) { rail.classList.toggle("open", o); scrim.hidden = !o; $("#menuBtn").setAttribute("aria-expanded", String(o)); }

  /* ---------- Lecture view ---------- */
  function renderLecture(id) {
    const lec = lecById(id) || LECTURES[0];
    const idx = LECTURES.indexOf(lec), prev = LECTURES[idx - 1], next = LECTURES[idx + 1];
    document.title = `Lecture ${lec.id} · Network Principles`;
    renderRail(lec.id);
    view.innerHTML = `<header class="lec-head"><p class="eyebrow">Lecture ${lec.id} of ${LECTURES.length}</p><h1>${esc(lec.title)}</h1><p class="blurb">${esc(lec.blurb)}</p><p class="source-note">Source: Network Principles_All Lectures.pdf. The file is one combined set of slides, so the five lectures here group its topics in the order they appear. Slide titles are given as references. Nothing outside the slides is added.</p><div class="lec-nav"><button class="btn" id="expandAll">Expand all</button><button class="btn" id="collapseAll">Collapse all</button><button class="btn primary" data-quiz="${lec.id}">Test this lecture</button></div></header>${lec.topics.map((t, n) => topicHtml(lec, t, n)).join("")}<footer class="lec-nav" style="margin-top:28px">${prev ? `<a class="btn" href="#lecture-${prev.id}">Previous: Lecture ${prev.id}</a>` : ""}${next ? `<a class="btn" href="#lecture-${next.id}">Next: Lecture ${next.id}</a>` : ""}<button class="btn primary" data-quiz="${lec.id}">Test Yourself</button><button class="btn" id="toStart">Back to start of lecture</button></footer>`;
    $("#expandAll").onclick = () => view.querySelectorAll("details.topic").forEach((d) => (d.open = true));
    $("#collapseAll").onclick = () => view.querySelectorAll("details.topic").forEach((d) => (d.open = false));
    $("#toStart").onclick = () => window.scrollTo({ top: 0 });
    if (pendingTopic) { const t = pendingTopic; pendingTopic = null; showTopic(lec.id, t); } else window.scrollTo({ top: 0 });
    observeTopics(lec);
  }
  function showTopic(lecId, topicId) {
    const el = document.getElementById(`t-${lecId}-${topicId}`);
    if (!el) return;
    el.open = true;
    el.scrollIntoView({ block: "start" });
  }
  let observer;
  function observeTopics(lec) {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          rail.querySelectorAll(".toc a").forEach((a) => a.classList.toggle("cur", `t-${lec.id}-${a.dataset.topic}` === e.target.id));
        }
      });
    }, { rootMargin: "-80px 0px -70% 0px" });
    view.querySelectorAll("details.topic").forEach((d) => observer.observe(d));
  }

  /* ---------- Quiz ---------- */
  const poolFor = (lec) => (lec === "all" ? QUESTIONS : QUESTIONS.filter((q) => q.lec === Number(lec)));
  /* Option order is shuffled each run (True / False keeps its order) so the right answer is not always in the same place. */
  function shuffled(q) {
    if (q.type === "True / False") return Object.assign({}, q);
    const order = q.opts.map((_, k) => k);
    for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
    return Object.assign({}, q, { opts: order.map((k) => q.opts[k]), a: order.indexOf(q.a) });
  }
  function startQuiz(lec) {
    quiz = { lec: String(lec), pool: poolFor(lec).map(shuffled), i: 0, ans: [], finished: false, focus: true };
    quiz.ans = quiz.pool.map(() => ({ sel: null, done: false }));
    renderQuiz();
  }
  const topicTitle = (q) => { const l = lecById(q.lec); const t = l && l.topics.find((x) => x.id === q.topic); return t ? t.title : q.topic; };

  function filterHtml() {
    const opts = [`<option value="all"${quiz.lec === "all" ? " selected" : ""}>All Lectures (${QUESTIONS.length} questions)</option>`]
      .concat(LECTURES.map((l) => `<option value="${l.id}"${quiz.lec === String(l.id) ? " selected" : ""}>Lecture ${l.id}: ${esc(l.title)} (${poolFor(l.id).length})</option>`));
    return `<div class="filter"><div><label for="lecFilter">Lecture</label><select id="lecFilter">${opts.join("")}</select></div><div class="count" aria-live="polite">${quiz.pool.length} question${quiz.pool.length === 1 ? "" : "s"} selected</div></div>`;
  }

  function renderQuiz() {
    document.title = "Test Yourself · Network Principles";
    renderRail("quiz");
    let h = `<div class="quiz"><p class="eyebrow">Practice</p><h1>Test Yourself</h1><p class="blurb">Questions come only from the lecture slides. Choose a lecture or practise them all.</p>${filterHtml()}`;
    if (!quiz.pool.length) h += `<div class="empty-msg">There are no questions for this selection yet.</div>`;
    else if (quiz.finished) h += resultsHtml();
    else h += questionHtml();
    view.innerHTML = h + "</div>";
    bindQuiz();
    if (quiz.focus) { quiz.focus = false; const f = $("#qfocus"); if (f) f.focus({ preventScroll: true }); }
  }

  function questionHtml() {
    const q = quiz.pool[quiz.i], a = quiz.ans[quiz.i], total = quiz.pool.length;
    const pct = Math.round((quiz.ans.filter((x) => x.done).length / total) * 100);
    let h = `<div class="q-meta"><span>Question <b>${quiz.i + 1}</b> of <b>${total}</b></span><span>${quiz.ans.filter((x) => x.done).length} answered</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Quiz progress"><i style="width:${pct}%"></i></div>`;
    h += `<p class="q-tag" id="qfocus" tabindex="-1">Lecture ${q.lec} · ${esc(topicTitle(q))} · ${esc(q.type)}</p><h2 class="q-text" id="qtext">${fmt(q.q)}</h2><ul class="opts" role="radiogroup" aria-labelledby="qtext">`;
    q.opts.forEach((o, k) => {
      let cls = "opt", tag = "";
      if (a.done) {
        if (k === q.a) { cls += " right"; tag = a.sel === k ? "Correct" : "Correct answer"; }
        else if (k === a.sel) { cls += " wrong"; tag = "Your answer"; }
      }
      h += `<li><button type="button" class="${cls}" role="radio" aria-checked="${a.sel === k}" data-k="${k}"${a.done ? " disabled" : ""}><span class="k">${letters[k]}</span><span>${fmt(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button></li>`;
    });
    h += `</ul><div id="fb" role="status" aria-live="polite">`;
    if (a.done) {
      const ok = a.sel === q.a;
      h += `<div class="feedback ${ok ? "ok" : "no"}"><h3>${ok ? "Correct" : "Incorrect"}</h3><p>${ok ? "" : `The correct answer is <strong>${letters[q.a]}. ${esc(q.opts[q.a])}</strong>. `}${fmt(q.why)}</p></div>`;
    }
    h += `</div><div class="q-actions"><button class="btn" id="prevQ"${quiz.i === 0 ? " disabled" : ""}>Previous</button><button class="btn primary" id="submitQ"${a.sel === null || a.done ? " disabled" : ""}>Submit Answer</button><button class="btn primary" id="nextQ"${a.done ? "" : " disabled"}>${quiz.i === total - 1 ? "See Results" : "Next Question"}</button></div>`;
    return h;
  }

  function resultsHtml() {
    const total = quiz.pool.length, right = quiz.pool.filter((q, i) => quiz.ans[i].sel === q.a).length, wrong = total - right, pct = Math.round((right / total) * 100);
    let h = `<div class="score" id="qfocus" tabindex="-1"><p class="label">Final score</p><div class="big">${right}<small> / ${total}</small></div><p style="margin:8px 0 0;font-size:18px"><b>${pct}%</b> correct</p><div class="stats"><div><b>${right}</b><span>Correct</span></div><div><b>${wrong}</b><span>Incorrect</span></div><div><b>${total}</b><span>Total</span></div></div><div class="q-actions"><button class="btn primary" id="restartQ">Restart Quiz</button></div></div><h2 style="font-size:20px;margin:28px 0 0">Review answers</h2><ol class="review">`;
    quiz.pool.forEach((q, i) => {
      const a = quiz.ans[i], ok = a.sel === q.a;
      h += `<li class="${ok ? "ok" : "no"}"><span class="rt">Q${i + 1} · Lecture ${q.lec} · ${esc(topicTitle(q))}</span><p class="rq">${fmt(q.q)}</p><p class="ra">Your answer: <b>${a.sel === null ? "No answer" : esc(q.opts[a.sel])}</b> ${ok ? "(correct)" : "(incorrect)"}</p>${ok ? "" : `<p class="ra">Correct answer: <b>${esc(q.opts[q.a])}</b></p>`}<p class="rw">${fmt(q.why)}</p></li>`;
    });
    return h + "</ol>";
  }

  function bindQuiz() {
    const f = $("#lecFilter");
    if (f) f.onchange = () => startQuiz(f.value);
    const group = $(".opts");
    const q = quiz.pool[quiz.i], a = quiz.ans[quiz.i];
    if (group && q) {
      const pick = (k) => { if (a.done) return; a.sel = k; renderQuizKeep(k); };
      group.querySelectorAll(".opt").forEach((b) => (b.onclick = () => pick(Number(b.dataset.k))));
      group.onkeydown = (e) => {
        if (a.done || !["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft"].includes(e.key)) return;
        e.preventDefault();
        const n = q.opts.length, cur = a.sel === null ? -1 : a.sel;
        pick(e.key === "ArrowDown" || e.key === "ArrowRight" ? (cur + 1) % n : (cur - 1 + n) % n);
      };
      $("#submitQ").onclick = () => { a.done = true; renderQuiz(); $("#fb").scrollIntoView({ block: "nearest" }); };
      $("#nextQ").onclick = () => { if (quiz.i === quiz.pool.length - 1) quiz.finished = true; else quiz.i++; quiz.focus = true; renderQuiz(); window.scrollTo({ top: 0 }); };
      $("#prevQ").onclick = () => { if (quiz.i > 0) { quiz.i--; quiz.focus = true; renderQuiz(); window.scrollTo({ top: 0 }); } };
    }
    const r = $("#restartQ");
    if (r) r.onclick = () => { startQuiz(quiz.lec); window.scrollTo({ top: 0 }); };
  }
  function renderQuizKeep(k) {
    const sy = window.scrollY;
    renderQuiz();
    window.scrollTo({ top: sy });
    const b = view.querySelector(`.opt[data-k="${k}"]`);
    if (b) b.focus({ preventScroll: true });
  }

  /* ---------- Search ---------- */
  const index = [];
  LECTURES.forEach((l) => l.topics.forEach((t) => {
    const parts = [t.title, t.source];
    t.blocks.forEach((b) => {
      if (b.x) parts.push(b.x);
      if (b.title) parts.push(b.title);
      if (b.caption) parts.push(b.caption);
      (b.items || []).forEach((i) => parts.push(Array.isArray(i) ? i.join(" ") : i));
      (b.rows || []).forEach((r) => parts.push(r.join(" ")));
      (b.pros || []).concat(b.cons || []).forEach((i) => parts.push(i));
    });
    index.push({ lec: l, topic: t, text: plain(parts.join(" · ")) });
  }));
  function search(qs) {
    const words = qs.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    return index.filter((e) => { const tx = (e.topic.title + " " + e.text).toLowerCase(); return words.every((w) => tx.includes(w)); }).slice(0, 20);
  }
  function snippet(text, qs) {
    const w = qs.toLowerCase().split(/\s+/)[0], i = text.toLowerCase().indexOf(w);
    const s = Math.max(0, i - 40);
    return (s > 0 ? "…" : "") + text.slice(s, s + 120) + "…";
  }
  function bindSearch() {
    const box = $("#searchBox"), inp = $("#searchInput"), out = $("#results");
    $("#searchBtn").onclick = () => { const o = !box.classList.contains("open"); box.classList.toggle("open", o); $("#searchBtn").setAttribute("aria-expanded", String(o)); if (o) inp.focus(); };
    inp.oninput = () => {
      const qs = inp.value.trim();
      const res = search(qs);
      if (!qs) { out.innerHTML = ""; $("#searchMsg").textContent = ""; return; }
      out.innerHTML = res.map((e, i) => `<li><button data-i="${i}"><div class="r-t">${esc(e.topic.title)}</div><div class="r-l">Lecture ${e.lec.id}: ${esc(e.lec.title)}</div><div class="r-s">${esc(snippet(e.text, qs))}</div></button></li>`).join("");
      $("#searchMsg").innerHTML = res.length ? "" : `<div class="empty-msg">No topics match “${esc(qs)}”.</div>`;
      out.querySelectorAll("button").forEach((b) => (b.onclick = () => { const e = res[Number(b.dataset.i)]; box.classList.remove("open"); $("#searchBtn").setAttribute("aria-expanded", "false"); go(e.lec.id, e.topic.id); }));
    };
    inp.onkeydown = (e) => { if (e.key === "Escape") { box.classList.remove("open"); $("#searchBtn").focus(); } };
  }

  /* ---------- Routing ---------- */
  function go(lecId, topicId) {
    pendingTopic = topicId || null;
    const target = `#lecture-${lecId}`;
    if (location.hash === target) route(); else location.hash = target;
  }
  function route() {
    const h = location.hash.slice(1);
    openRail(false);
    if (h === "test-yourself") { if (!quiz.pool.length && quiz.lec === "all" && !quiz.ans.length) startQuiz("all"); else renderQuiz(); }
    else { const m = /^lecture-(\d+)$/.exec(h); renderLecture(m ? Number(m[1]) : 1); }
  }
  window.addEventListener("hashchange", route);

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-lec],[data-go],[data-quiz],#closeRail");
    if (!t) return;
    if (t.id === "closeRail") return openRail(false);
    if (t.dataset.topic) { e.preventDefault(); return go(Number(t.dataset.lec), t.dataset.topic); }
    if (t.dataset.go === "quiz") { openRail(false); if (location.hash !== "#test-yourself") location.hash = "test-yourself"; else renderQuiz(); return; }
    if (t.dataset.quiz) { startQuiz(t.dataset.quiz); if (location.hash !== "#test-yourself") location.hash = "test-yourself"; return; }
    if (t.classList.contains("lec-btn")) go(Number(t.dataset.lec));
  });
  $("#menuBtn").onclick = () => openRail(!rail.classList.contains("open"));
  scrim.onclick = () => openRail(false);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") openRail(false); });
  $("#quizBtn").onclick = () => { if (location.hash !== "#test-yourself") location.hash = "test-yourself"; };

  /* ---------- Reading progress and back to top ---------- */
  const prog = $("#prog"), toTop = $("#toTop");
  toTop.onclick = () => window.scrollTo({ top: 0 });
  function onScroll() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const reading = location.hash !== "#test-yourself";
    prog.style.width = reading && max > 0 ? Math.min(100, (window.scrollY / max) * 100) + "%" : "0";
    toTop.hidden = window.scrollY < 700;
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* ---------- Start ---------- */
  try {
    bindSearch();
    route();
    onScroll();
  } catch (err) {
    view.innerHTML = `<div class="state"><h1>Something went wrong</h1><p>The lecture content could not be displayed. Reload the page to try again.</p></div>`;
    console.error(err);
  }
})();


</script>

</body></html>
